# The app is served by Cloudflare Pages, on an origin of its own. The old GitHub Pages address keeps a page that
# forwards visitors, route included, to the new one; this publishes that page whenever it changes.
name: GitHub Pages redirect

on:
  push:
    branches: [main]
    paths: [.github/pages-redirect/**, .github/workflows/pages-redirect.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v5
