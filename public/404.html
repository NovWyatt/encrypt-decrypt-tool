<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Không tìm thấy trang | Encrypt/Decrypt Tool</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Cloudflare Pages sends this page, with status 404, for every path that is not in the build. Keep it free of
         inline scripts: the Content-Security-Policy only allows the one in index.html. -->
    <style>
      :root {
        color-scheme: light;
        --background: oklch(0.975 0.002 286);
        --foreground: oklch(0.2 0.006 286);
        --muted-foreground: oklch(0.49 0.012 286);
        --primary: oklch(0.51 0.19 263);
        --primary-foreground: oklch(0.985 0.01 263);
        --ring: oklch(0.51 0.19 263 / 55%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: oklch(0.16 0.005 286);
          --foreground: oklch(0.955 0.003 286);
          --muted-foreground: oklch(0.7 0.012 286);
          --primary: oklch(0.72 0.13 262);
          --primary-foreground: oklch(0.17 0.03 265);
          --ring: oklch(0.72 0.13 262 / 55%);
        }
      }

      body {
        box-sizing: border-box;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 2.5rem 1.25rem;
        background: var(--background);
        color: var(--foreground);
        font:
          1rem/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 34rem;
      }

      .status {
        margin: 0;
        color: var(--muted-foreground);
        font:
          600 0.8125rem/1 ui-monospace,
          'Cascadia Mono',
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0.75rem 0 0;
        color: var(--muted-foreground);
        text-wrap: pretty;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.5rem;
        margin-top: 1.75rem;
        padding: 0 1rem;
        border-radius: 0.625rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 500;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }

      /* Contrast themes drop the fill, so the link keeps an edge. */
      @media (forced-colors: active) {
        a {
          border: 1px solid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">404</p>
      <h1>Không tìm thấy trang</h1>
      <p>Địa chỉ này không có trong Encrypt/Decrypt Tool. Có thể liên kết đã cũ hoặc bị gõ sai.</p>
      <p lang="en">
        Page not found. This address is not part of Encrypt/Decrypt Tool. Use the link below to open the app.
      </p>
      <a href="/">Mở Encrypt/Decrypt Tool</a>
    </main>
  </body>
</html>
